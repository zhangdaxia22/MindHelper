const stageDefs=[{name:'Observation',key:'observation',input:null,inputName:null,channel:'observation'},{name:'Belief Table',key:'belief',input:'observation',inputName:'Observation',channel:'belief'},{name:'Mental Reasoning',key:'reasoning',input:'belief',inputName:'Observation + Belief Table',channel:'reasoning'},{name:'Action Generation',key:'action',input:'reasoning',inputName:'Mental Reasoning',channel:'action'}];
const phaseNames=['Observe','Reason','Assist','Feedback'];
const robotStates={wineglass:['silent','silent','silent','silent','action','action','action','action','silent'],toothpaste:['silent','silent','silent','silent','silent','silent','silent','action','action','action','action','silent']};
const video=document.getElementById('video');const caseTabs=[...document.querySelectorAll('.case')];const stageTabs=[...document.querySelectorAll('.stage')];const phases=[...document.querySelectorAll('.phase')];const windowSelect=document.getElementById('window-select');
let example=examples.wineglass,selectedStage=0,activeScene=-1,pendingSeek=null,revision=0;
function formatTime(value){const n=Math.max(0,Math.floor(value));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function currentScene(){let i=0;const t=video.currentTime||0;for(let j=0;j<example.scenes.length;j++)if(t+.005>=example.scenes[j].time)i=j;return {index:i,scene:example.scenes[i]};}
function renderBelief(index){
const data=beliefSnapshots[example.id],row=data.rows[index],previous=index>0?data.rows[index-1]:null;const stateValue=value=>value.replace(/ \(last (?:recorded|observed)\)/g,'');
const head=document.getElementById('belief-head'),body=document.getElementById('belief-body');head.replaceChildren();body.replaceChildren();
const hr=document.createElement('tr');data.headers.forEach(label=>{const th=document.createElement('th');th.scope='col';th.textContent=label;hr.append(th);});head.append(hr);
const tr=document.createElement('tr');row.forEach((value,column)=>{const cell=document.createElement('td');cell.textContent=value;if(column===1)cell.classList.add('fact');if(column>0&&previous&&stateValue(value)!==stateValue(previous[column]))cell.classList.add('changed');if(column>1&&previous&&stateValue(value)===stateValue(previous[column]))cell.classList.add('retained');tr.append(cell);});body.append(tr);
const scene=example.scenes[index],end=example.scenes[index+1]?.time??example.duration;document.getElementById('belief-window').textContent=`W${String(index+1).padStart(2,'0')} · ${formatTime(scene.time)}–${formatTime(end)}`;
document.getElementById('belief-note').textContent=data.notes[index];document.getElementById('belief-card').dataset.example=example.id;reportSize();
}
function beliefText(index){const data=beliefSnapshots[example.id];return data.headers.slice(1).map((label,i)=>`${label}: ${data.rows[index][i+1]}`).join('\n');}
function renderStage(){const {index,scene}=currentScene();const def=stageDefs[selectedStage];document.querySelector('.outputs').dataset.stage=String(selectedStage);document.getElementById('output-card').hidden=selectedStage===1;document.getElementById('belief-title').textContent=selectedStage===1?'Output · Belief Table':'Belief Table';renderBelief(index);document.getElementById('stage-title').textContent=def.name;document.getElementById('stage-counter').textContent=`Stage ${selectedStage+1} of 4`;
stageTabs.forEach((tab,i)=>{const selected=i===selectedStage;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;});document.getElementById('stage-panel').setAttribute('aria-labelledby',stageTabs[selectedStage].id);
const inputCard=document.getElementById('input-card');inputCard.hidden=!def.input;if(def.input){document.getElementById('input-label').textContent=`Input · ${def.inputName}`;document.getElementById('input-value').textContent=selectedStage===2?scene.observation+'\n\n'+beliefText(index):scene[def.input];inputCard.dataset.channel=def.input;}
document.getElementById('output-label').textContent=`Output · ${def.key==='action'?'Trigger / Action':def.name}`;document.getElementById('output-value').textContent=scene[def.key];document.getElementById('output-card').dataset.channel=def.channel;reportSize();}
function update(){const {index,scene}=currentScene();const t=video.currentTime||0;if(index!==activeScene){activeScene=index;windowSelect.value=String(index);document.getElementById('scene-name').textContent=`${phaseNames[scene.phase]} · ${scene.name}`;document.getElementById('caption').textContent=scene.caption;const robotState=robotStates[example.id][index];document.getElementById('robot-status').dataset.state=robotState;document.getElementById('robot-status-value').textContent=robotState==='action'?'Take action':'Keep silent';renderStage();}
phases.forEach((button,i)=>{if(i===scene.phase)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');const end=example.phaseStarts[i+1]??example.duration;button.style.setProperty('--progress',`${Math.max(0,Math.min(100,(t-example.phaseStarts[i])/(end-example.phaseStarts[i])*100))}%`);});document.getElementById('time').textContent=`${formatTime(t)} / ${formatTime(video.duration||example.duration)}`;}
function updatePlay(){const playing=!video.paused&&!video.ended;document.getElementById('play-label').textContent=playing?'Pause example':video.ended?'Replay example':'Play example';document.getElementById('play-icon').setAttribute('d',playing?'M4 3h4v14H4zM12 3h4v14h-4z':'M5 3l12 7-12 7z');}
async function start(){const r=revision;try{await video.play();}catch{if(r===revision)updatePlay();}}
function seekTo(time,shouldPlay=!video.paused&&!video.ended){video.pause();if(video.readyState<1){pendingSeek={time,shouldPlay};video.load();return;}video.currentTime=Math.min(time,Math.max(0,video.duration-.04));update();if(shouldPlay)start();}
function selectStage(i){selectedStage=i;renderStage();updatePlay();}
function selectExample(id){if(!examples[id])return;revision++;video.pause();pendingSeek=null;example=examples[id];activeScene=-1;selectedStage=0;caseTabs.forEach(tab=>{const selected=tab.dataset.example===id;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;});
windowSelect.replaceChildren();example.scenes.forEach((scene,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=`${formatTime(scene.time)} · ${scene.name}`;windowSelect.append(option);});phases.forEach((button,i)=>button.querySelector('time').textContent=formatTime(example.phaseStarts[i]));
video.poster=example.poster;video.setAttribute('aria-label',`MindClaw ${example.category} example`);document.getElementById('source').src=example.video;document.getElementById('track').src=example.captions;document.getElementById('error').hidden=true;document.getElementById('error-download').href=example.video;const download=document.getElementById('download');download.href=example.video;download.download=`mindclaw-${id}-demo.mp4`;
const transcript=document.getElementById('transcript');transcript.replaceChildren();example.scenes.forEach(scene=>{const li=document.createElement('li'),button=document.createElement('button'),time=document.createElement('time'),caption=document.createElement('span');button.type='button';time.textContent=formatTime(scene.time);caption.textContent=scene.caption;button.append(time,caption);button.addEventListener('click',()=>seekTo(scene.time+.02));li.append(button);transcript.append(li);});video.load();update();renderStage();updatePlay();reportSize();}
function keyboardTabs(tabs,i,event,select){let next;if(event.key==='ArrowRight'||event.key==='ArrowDown')next=(i+1)%tabs.length;if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=(i+tabs.length-1)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;if(next!==undefined){event.preventDefault();select(next);tabs[next].focus();}}
caseTabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectExample(tab.dataset.example));tab.addEventListener('keydown',event=>keyboardTabs(caseTabs,i,event,j=>selectExample(caseTabs[j].dataset.example)));});stageTabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectStage(i));tab.addEventListener('keydown',event=>keyboardTabs(stageTabs,i,event,selectStage));});windowSelect.addEventListener('change',()=>seekTo(example.scenes[Number(windowSelect.value)].time+.02));phases.forEach((button,i)=>button.addEventListener('click',()=>seekTo(example.phaseStarts[i]+.02)));
document.getElementById('play').addEventListener('click',()=>{if(video.paused||video.ended){if(video.ended)video.currentTime=0;start();}else video.pause();});document.getElementById('restart').addEventListener('click',()=>seekTo(0,true));
let playbackFrame=null;function followPlayback(){update();if(!video.paused&&!video.ended)playbackFrame=requestAnimationFrame(followPlayback);else playbackFrame=null;}video.addEventListener('play',()=>{if(playbackFrame===null)playbackFrame=requestAnimationFrame(followPlayback);});video.addEventListener('pause',()=>{if(playbackFrame!==null)cancelAnimationFrame(playbackFrame);playbackFrame=null;update();});
video.addEventListener('loadedmetadata',()=>{if(pendingSeek){const p=pendingSeek;pendingSeek=null;seekTo(p.time,p.shouldPlay);}update();});['timeupdate','seeked','loadeddata','ended'].forEach(name=>video.addEventListener(name,update));['play','pause','ended'].forEach(name=>video.addEventListener(name,updatePlay));video.addEventListener('error',()=>document.getElementById('error').hidden=false);
function reportSize(){if(window.parent===window)return;window.parent.postMessage({type:'mindclaw-demo-resize',height:Math.ceil(document.querySelector('.demo').getBoundingClientRect().height)},'*');}if('ResizeObserver'in window)new ResizeObserver(reportSize).observe(document.querySelector('.demo'));window.addEventListener('load',reportSize);window.addEventListener('resize',reportSize);
selectExample(new URLSearchParams(location.search).get('example')||'wineglass');
})();
